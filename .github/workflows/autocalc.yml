name: AutoCalc MY v0.5 Insurance UX
on:
  push:
    branches:
      - autocalc-my-v0-1
      - autocalc-my-v0-2
      - autocalc-my-v0-3
      - autocalc-my-v0-4
      - autocalc-my-v0-5
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate unique AutoCalc MY Android package
        run: |
          rm -rf android
          flutter create --platforms=android --org my.autocalc --project-name kiroda .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="kiroda"','android:label="AutoCalc MY"').replace('android:label="KIRODA"','android:label="AutoCalc MY"')
          s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
          p.write_text(s)
          gradle=Path('android/app/build.gradle.kts')
          if gradle.exists():
            t=gradle.read_text().replace('applicationId = "my.autocalc.kiroda"','applicationId = "my.autocalc.sav5"')
            t=t.replace('versionName = flutter.versionName','versionName = "0.5.0"')
            gradle.write_text(t)
          PY
      - name: Install offline and share-image dependencies
        run: |
          flutter pub add path_provider url_launcher http
          flutter pub get
      - name: Analyze AutoCalc sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/autocalc_main.dart lib/autocalc/finance.dart lib/autocalc/plates_screen.dart lib/autocalc/plates_data.dart lib/autocalc/sa_tools.dart lib/autocalc/number_format.dart
      - name: Test payment math
        run: flutter test test/autocalc_finance_test.dart test/autocalc_tools_test.dart test/autocalc_plates_test.dart test/autocalc_number_format_test.dart
      - name: Build signed debug test APK
        run: flutter build apk --debug -t lib/autocalc_main.dart
      - name: Build smaller per-ABI test APKs
        run: flutter build apk --release --split-per-abi -t lib/autocalc_main.dart
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoCalc-MY-SA-v0.5-APKs
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

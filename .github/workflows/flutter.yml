name: Flutter CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'PROJECT_STATE.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap generated Flutter platform files
        run: rm -rf android && flutter create --platforms=android --org my.kiroda --project-name kiroda .
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kiroda-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

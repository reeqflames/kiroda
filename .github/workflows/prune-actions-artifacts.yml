name: Prune old Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-actions-artifacts.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-actions-artifacts
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep two newest artifacts, remove older copies
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            // Artifacts referenced by an existing release workflow must remain available.
            const protectedIds = new Set([]);
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const artifacts = all.filter(a => !a.expired).sort((a, b) =>
              Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id
            );
            const keep = new Set([...artifacts.slice(0, 2).map(a => a.id), ...protectedIds]);
            let deleted = 0;
            let bytesFreed = 0;
            for (const a of artifacts) {
              if (keep.has(a.id)) continue;
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: a.id
              });
              deleted++;
              bytesFreed += a.size_in_bytes || 0;
              core.info(`Deleted old artifact ${a.id}: ${a.name}`);
            }
            core.info(`Cleanup complete: ${deleted} artifacts deleted; ${(bytesFreed/1000000).toFixed(1)} MB removed.`);
            await core.summary
              .addHeading('Artifact storage cleanup')
              .addRaw(`Deleted ${deleted} old artifacts (~${(bytesFreed/1000000).toFixed(1)} MB). Kept latest two plus any protected IDs. Releases and source files were not touched.`)
              .write();
